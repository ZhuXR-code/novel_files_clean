workflows:
  build-ios:
    name: Build iOS IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: 16.0
      vars:
        APP_DEVELOPMENT_TEAM: SGY2APMUQ5
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: false  # 手动触发，不自动构建
    scripts:
      - name: 显示构建信息
        script: |
          xcodebuild -version
          swift --version
      - name: Clean
        script: |
          cd ios_app
          xcodebuild clean \
            -project booksclean.xcodeproj \
            -scheme booksclean \
            -configuration Release \
            -sdk iphoneos
      - name: Archive
        script: |
          cd ios_app
          mkdir -p $CM_BUILD_DIR/build
          xcodebuild archive \
            -project booksclean.xcodeproj \
            -scheme booksclean \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -archivePath $CM_BUILD_DIR/build/booksclean.xcarchive \
            DEVELOPMENT_TEAM="$APP_DEVELOPMENT_TEAM"
      - name: Export IPA
        script: |
          mkdir -p build/ipa
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/build/FileScanner.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist $CM_EXPORT_OPTIONS_PLIST
    artifacts:
      - build/ipa/*.ipa
    publishing:
      email:
        recipients:
          - your@email.com
