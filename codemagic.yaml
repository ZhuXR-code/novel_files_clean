workflows:
  build-ios:
    name: Build iOS IPA (Ad Hoc 测试)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: 16.0
      groups:
        - ios_signing
      vars:
        APP_DEVELOPMENT_TEAM: SGY2APMUQ5
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: false  # 手动触发，不自动构建
    scripts:
      - name: 显示构建信息
        script: |
          xcodebuild -version
          swift --version
      - name: 安装签名证书与描述文件
        script: |
          set -e
          echo "=== 1) 当前 keychain 中的签名身份 ==="
          security find-identity -v -p codesigning || true
          echo "=== 2) 当前已安装的 Provisioning Profiles ==="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles" 2>/dev/null || echo "(目录不存在)"

          echo "=== 2.5) 环境变量状态检查 ==="
          for v in DIST_P12_B64 ADHOC_PROFILE_B64 DIST_P12_PASSWORD; do
            if [ -n "${!v:-}" ]; then
              echo "$v: 已设置"
            else
              echo "$v: 未设置"
            fi
          done

          # 兜底：用 base64 环境变量还原 p12 / profile 并手动安装
          if [ -n "${DIST_P12_B64:-}" ]; then
            echo "=== 3) 手动导入 p12 ==="
            echo "$DIST_P12_B64" | base64 --decode > /tmp/dist.p12
            ls -la /tmp/dist.p12
            KEYCHAIN="$HOME/Library/Keychains/ci-signing.keychain-db"
            security create-keychain -p ci "$KEYCHAIN" 2>/dev/null || true
            security default-keychain -s "$KEYCHAIN"
            security unlock-keychain -p ci "$KEYCHAIN"
            security import /tmp/dist.p12 -k "$KEYCHAIN" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN" 2>/dev/null || true
            rm -f /tmp/dist.p12
            echo "p12 导入完成"
          fi
          if [ -n "${ADHOC_PROFILE_B64:-}" ]; then
            echo "=== 4) 手动安装 Ad Hoc profile ==="
            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            echo "$ADHOC_PROFILE_B64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/booksclean-adhoc.mobileprovision"
            echo "profile 安装完成"
          fi

          echo "=== 5) 安装后签名身份 ==="
          security find-identity -v -p codesigning || true
          echo "=== 6) 安装后 Profiles 目录 ==="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles" 2>/dev/null || true
      - name: Clean
        script: |
          cd ios_app
          xcodebuild clean \
            -project booksclean.xcodeproj \
            -scheme booksclean \
            -configuration Release \
            -sdk iphoneos
      - name: Archive
        script: |
          cd ios_app
          mkdir -p $CM_BUILD_DIR/build
          xcodebuild archive \
            -project booksclean.xcodeproj \
            -scheme booksclean \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -archivePath $CM_BUILD_DIR/build/booksclean.xcarchive \
            DEVELOPMENT_TEAM="$APP_DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER=booksclean-adhoc
      - name: Export IPA
        script: |
          mkdir -p build/ipa
          cat > build/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>ad-hoc</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>SGY2APMUQ5</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.booksclean.app</key>
                  <string>booksclean-adhoc</string>
              </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/build/booksclean.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist build/ExportOptions.plist
    artifacts:
      - build/ipa/*.ipa
    publishing:
      email:
        recipients:
          - your@email.com

  release-appstore:
    name: Release iOS to App Store (上架)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: 16.4
      groups:
        - ios_signing  # 已包含 APPSTORE_API_KEY_ID / APPSTORE_API_ISSUER_ID / APPSTORE_PROFILE_B64 / APPSTORE_API_KEY_B64
      vars:
        APP_DEVELOPMENT_TEAM: SGY2APMUQ5
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: false  # 手动触发，不自动构建
    scripts:
      - name: 显示构建信息
        script: |
          xcodebuild -version
          swift --version
      - name: 安装签名证书与描述文件 (App Store)
        script: |
          set -e
          echo "=== 环境变量状态检查 ==="
          for v in DIST_P12_B64 APPSTORE_PROFILE_B64 DIST_P12_PASSWORD; do
            if [ -n "${!v:-}" ]; then
              echo "$v: 已设置"
            else
              echo "$v: 未设置"
            fi
          done

          if [ -z "${DIST_P12_B64:-}" ] || [ -z "${APPSTORE_PROFILE_B64:-}" ]; then
            echo "ERROR: 缺少 DIST_P12_B64 或 APPSTORE_PROFILE_B64，请在 Codemagic 环境变量组 ios_signing 中配置。"
            exit 1
          fi

          KEYCHAIN="$HOME/Library/Keychains/ci-signing.keychain-db"
          security create-keychain -p ci "$KEYCHAIN" 2>/dev/null || true
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"

          echo "=== 导入 Distribution p12 ==="
          echo "$DIST_P12_B64" | base64 --decode > /tmp/dist.p12
          security import /tmp/dist.p12 -k "$KEYCHAIN" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN" 2>/dev/null || true
          rm -f /tmp/dist.p12

          echo "=== 安装 App Store Provisioning Profile ==="
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$APPSTORE_PROFILE_B64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/booksclean-appstore.mobileprovision"
          echo "App Store profile 安装完成"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles"
      - name: Clean
        script: |
          cd ios_app
          xcodebuild clean \
            -project booksclean.xcodeproj \
            -scheme booksclean \
            -configuration Release \
            -sdk iphoneos
      - name: Archive
        script: |
          cd ios_app
          mkdir -p $CM_BUILD_DIR/build
          xcodebuild archive \
            -project booksclean.xcodeproj \
            -scheme booksclean \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -archivePath $CM_BUILD_DIR/build/booksclean.xcarchive \
            DEVELOPMENT_TEAM="$APP_DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER=booksclean-appstore
      - name: Export IPA (App Store)
        script: |
          mkdir -p build/ipa
          cat > build/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>SGY2APMUQ5</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.booksclean.app</key>
                  <string>booksclean-appstore</string>
              </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/build/booksclean.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist build/ExportOptions.plist
    artifacts:
      - build/ipa/*.ipa
    publishing:
      email:
        recipients:
          - your@email.com
      scripts:
        - name: 上传 IPA 到 App Store Connect
          script: |
            set -e
            if [ -z "${APPSTORE_API_KEY_B64:-}" ] || [ -z "${APPSTORE_API_KEY_ID:-}" ] || [ -z "${APPSTORE_API_ISSUER_ID:-}" ]; then
              echo "ERROR: 缺少 APPSTORE_API_KEY_B64 / APPSTORE_API_KEY_ID / APPSTORE_API_ISSUER_ID，请在 ios_signing 变量组中配置。"
              exit 1
            fi

            # 清理环境变量中可能混入的换行/空格（Codemagic 复制粘贴时常带尾部换行）
            APPSTORE_API_KEY_ID=$(printf '%s' "$APPSTORE_API_KEY_ID" | tr -d '[:space:]')
            APPSTORE_API_ISSUER_ID=$(printf '%s' "$APPSTORE_API_ISSUER_ID" | tr -d '[:space:]')

            # 从 base64 还原 p8 文件
            KEY_DIR="$HOME/.appstoreconnect/private_keys"
            mkdir -p "$KEY_DIR"
            KEY_PATH="$KEY_DIR/AuthKey_${APPSTORE_API_KEY_ID}.p8"
            printf '%s' "$APPSTORE_API_KEY_B64" | base64 --decode > "$KEY_PATH"
            chmod 600 "$KEY_PATH"

            echo "=== p8 文件已还原 ==="
            ls -la "$KEY_DIR/"
            if ! grep -qE "BEGIN (EC )?PRIVATE KEY" "$KEY_PATH"; then
              echo "ERROR: 还原的 p8 文件不是有效的 EC 私钥格式（应为 PKCS#8 或 SEC1），请检查 APPSTORE_API_KEY_B64。"
              exit 1
            fi

            # 诊断：打印 Key ID 与 Issuer ID（脱敏），便于核对 App Store Connect 上的真实值
            echo "=== 密钥凭证核对 ==="
            echo "API Key ID : $APPSTORE_API_KEY_ID"
            echo "Issuer ID  : ${APPSTORE_API_ISSUER_ID:0:8}**** (长度 ${#APPSTORE_API_ISSUER_ID})"
            echo "提示: Issuer ID 应为 36 位 UUID(如 69a6de91-xxxx...)，不是 Team ID(SGY2APMUQ5)。若长度不对，请到 App Store Connect → 用户和访问 → 密钥 页面顶部复制。"

            IPA=$(ls build/ipa/*.ipa | head -n 1)
            echo "上传 IPA: $IPA"

            # altool 是 API Key 上传 iOS 构建的唯一官方 CLI 途径（xcodebuild 无 -uploadArchive）
            echo "=== 1/2 校验应用 ==="
            xcrun altool --validate-app \
              --type ios --file "$IPA" \
              --apiKey "$APPSTORE_API_KEY_ID" \
              --apiIssuer "$APPSTORE_API_ISSUER_ID" \
              --output-format normal

            echo "=== 2/2 上传到 App Store Connect ==="
            xcrun altool --upload-app \
              --type ios --file "$IPA" \
              --apiKey "$APPSTORE_API_KEY_ID" \
              --apiIssuer "$APPSTORE_API_ISSUER_ID" \
              --show-progress \
              --output-format normal

            echo "上传成功，请到 App Store Connect 网页端选择构建版本并提交审核。"
