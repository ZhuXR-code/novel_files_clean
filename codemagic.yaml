workflows:
  build-ios:
    name: Build iOS IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: 16.0
      vars:
        APP_DEVELOPMENT_TEAM: SGY2APMUQ5
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: false  # 手动触发，不自动构建
    scripts:
      - name: 显示构建信息
        script: |
          xcodebuild -version
          swift --version
      - name: Clean
        script: |
          cd ios_app
          xcodebuild clean \
            -project booksclean.xcodeproj \
            -scheme booksclean \
            -configuration Release \
            -sdk iphoneos
      - name: 安装签名证书与描述文件
        script: |
          cd ios_app
          # 1. 安装 provisioning profile
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp signing/bookscleanadhoc.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/"
          # 2. 创建专用 keychain 并导入 p12 证书
          KEYCHAIN_PATH="$HOME/Library/Keychains/ios-build.keychain-db"
          KEYCHAIN_PWD="ios-build"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH" 2>/dev/null || true
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security import signing/distribution.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "BooksClean2026" \
            -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security list-keychains -s "$KEYCHAIN_PATH"
          security set-keychain-preference "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          # 3. 打印已安装的签名身份供日志排查
          security find-identity -v -p codesigning
      - name: Archive
        script: |
          cd ios_app
          mkdir -p $CM_BUILD_DIR/build
          xcodebuild archive \
            -project booksclean.xcodeproj \
            -scheme booksclean \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -archivePath $CM_BUILD_DIR/build/booksclean.xcarchive \
            DEVELOPMENT_TEAM="$APP_DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER=booksclean-adhoc
      - name: Export IPA
        script: |
          mkdir -p build/ipa
          cat > build/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>ad-hoc</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>SGY2APMUQ5</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.booksclean.app</key>
                  <string>booksclean-adhoc</string>
              </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/build/booksclean.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist build/ExportOptions.plist
    artifacts:
      - build/ipa/*.ipa
    publishing:
      email:
        recipients:
          - your@email.com
