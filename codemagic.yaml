workflows:
  build-ios:
    name: Build iOS IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: 16.0
      groups:
        - ios_signing
      vars:
        APP_DEVELOPMENT_TEAM: SGY2APMUQ5
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: false  # 手动触发，不自动构建
    scripts:
      - name: 显示构建信息
        script: |
          xcodebuild -version
          swift --version
      - name: 安装签名证书与描述文件
        script: |
          set -e
          echo "=== 1) 当前 keychain 中的签名身份 ==="
          security find-identity -v -p codesigning || true
          echo "=== 2) 当前已安装的 Provisioning Profiles ==="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles" 2>/dev/null || echo "(目录不存在)"

          echo "=== 2.5) 环境变量状态检查 ==="
          echo "DIST_P12_B64: ${DIST_P12_B64:+已设置 (长度 ${#DIST_P12_B64})}${DIST_P12_B64:-未设置}"
          echo "ADHOC_PROFILE_B64: ${ADHOC_PROFILE_B64:+已设置 (长度 ${#ADHOC_PROFILE_B64})}${ADHOC_PROFILE_B64:-未设置}"
          echo "DIST_P12_PASSWORD: ${DIST_P12_PASSWORD:+已设置}${DIST_P12_PASSWORD:-未设置}"

          # 兜底：用 base64 环境变量还原 p12 / profile 并手动安装
          if [ -n "${DIST_P12_B64:-}" ]; then
            echo "=== 3) 手动导入 p12 ==="
            echo "$DIST_P12_B64" | base64 --decode > /tmp/dist.p12
            ls -la /tmp/dist.p12
            KEYCHAIN="$HOME/Library/Keychains/ci-signing.keychain-db"
            security create-keychain -p ci "$KEYCHAIN" 2>/dev/null || true
            security default-keychain -s "$KEYCHAIN"
            security unlock-keychain -p ci "$KEYCHAIN"
            security import /tmp/dist.p12 -k "$KEYCHAIN" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN" 2>/dev/null || true
            rm -f /tmp/dist.p12
            echo "p12 导入完成"
          fi
          if [ -n "${ADHOC_PROFILE_B64:-}" ]; then
            echo "=== 4) 手动安装 Ad Hoc profile ==="
            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            echo "$ADHOC_PROFILE_B64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/booksclean-adhoc.mobileprovision"
            echo "profile 安装完成"
          fi

          echo "=== 5) 安装后签名身份 ==="
          security find-identity -v -p codesigning || true
          echo "=== 6) 安装后 Profiles 目录 ==="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles" 2>/dev/null || true
      - name: Clean
        script: |
          cd ios_app
          xcodebuild clean \
            -project booksclean.xcodeproj \
            -scheme booksclean \
            -configuration Release \
            -sdk iphoneos
      - name: Archive
        script: |
          cd ios_app
          mkdir -p $CM_BUILD_DIR/build
          xcodebuild archive \
            -project booksclean.xcodeproj \
            -scheme booksclean \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -archivePath $CM_BUILD_DIR/build/booksclean.xcarchive \
            DEVELOPMENT_TEAM="$APP_DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER=booksclean-adhoc
      - name: Export IPA
        script: |
          mkdir -p build/ipa
          cat > build/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>ad-hoc</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>SGY2APMUQ5</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.booksclean.app</key>
                  <string>booksclean-adhoc</string>
              </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/build/booksclean.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist build/ExportOptions.plist
    artifacts:
      - build/ipa/*.ipa
    publishing:
      email:
        recipients:
          - your@email.com
