workflows:
  build-ios:
    name: Build iOS IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: 16.0
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.booksclean.app
      vars:
        APP_DEVELOPMENT_TEAM: SGY2APMUQ5
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: false  # 手动触发，不自动构建
    scripts:
      - name: 显示构建信息
        script: |
          xcodebuild -version
          swift --version
      - name: Clean
        script: |
          cd ios_app
          xcodebuild clean \
            -project booksclean.xcodeproj \
            -scheme booksclean \
            -configuration Release \
            -sdk iphoneos
      - name: Archive
        script: |
          cd ios_app
          mkdir -p $CM_BUILD_DIR/build
          xcodebuild archive \
            -project booksclean.xcodeproj \
            -scheme booksclean \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -archivePath $CM_BUILD_DIR/build/booksclean.xcarchive \
            DEVELOPMENT_TEAM="$APP_DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER=bookscleanadhoc
      - name: Export IPA
        script: |
          mkdir -p build/ipa
          cat > build/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>ad-hoc</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>SGY2APMUQ5</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.booksclean.app</key>
                  <string>bookscleanadhoc</string>
              </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/build/booksclean.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist build/ExportOptions.plist
    artifacts:
      - build/ipa/*.ipa
    publishing:
      email:
        recipients:
          - your@email.com
